<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 / 注册 · 青果短剧</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(ellipse at 50% 0%, #1d4433 0%, #0b1511 65%);
      color: #eef5ef;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(420px, 100%); padding: 30px 28px; border-radius: 18px;
      background: rgba(19, 32, 26, 0.96); border: 1px solid #2c4738;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
    .brand-logo { width: 52px; height: 52px; flex-shrink: 0; }
    .brand-caption { margin: 4px 0 0; color: #91ad9e; font-size: 10px; letter-spacing: 2px; }
    h1 { margin: 0; font-size: 23px; letter-spacing: 1px; }
    .sub { margin: 0 0 20px; color: #a1b5a7; font-size: 12.5px; }
    .tabs {
      display: flex; gap: 6px; padding: 4px; border-radius: 11px;
      background: #0e1c15; border: 1px solid #283e30; margin-bottom: 20px;
    }
    .tab {
      flex: 1; padding: 8px 10px; border: 0; border-radius: 8px;
      background: transparent; color: #a1b5a7; font: inherit; font-weight: 600; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .tab.active { background: #294333; color: #e2f8d1; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .field { margin-bottom: 14px; }
    label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #c1d1c5; }
    label span.opt { color: #91a79a; font-weight: 400; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #365040; background: #0b1710; color: #eef5ef; font: inherit;
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #a4e372; }
    button:focus-visible { outline: 2px solid #a4e372; outline-offset: 3px; }
    .primary-btn {
      width: 100%; margin-top: 8px; padding: 11px 16px; border: 0; border-radius: 999px;
      background: linear-gradient(110deg, #b5ea76, #69ce86); color: #102b1c;
      font: inherit; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .primary-btn:active { transform: translateY(1px); }
    .primary-btn:disabled { opacity: .55; cursor: default; }
    .ghost-btn {
      width: 100%; margin-top: 10px; padding: 9px 14px; border-radius: 999px;
      border: 1px solid #365040; background: transparent; color: #c1d1c5;
      font: inherit; cursor: pointer;
    }
    .banner {
      padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 12.5px;
      border: 1px solid #3b5734; background: rgba(164, 227, 114, 0.08); color: #b5ea90;
    }
    .banner.ok { border-color: rgba(34, 197, 94, 0.35); background: rgba(34, 197, 94, 0.1); color: #86efac; }
    .banner.warn { border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.1); color: #fca5a5; }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; text-align: center; }
    .msg.error { color: #ff8d8d; }
    .msg.ok { color: #86efac; }
    .hidden { display: none !important; }
    .foot-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid #283e30; font-size: 12px; color: #91a79a; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <!-- Inline copy of frontend/app/assets/qingguo-logo.svg: visible before authentication. -->
      <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="青果短剧 LOGO">
        <defs>
          <linearGradient id="tile" x1="28" y1="12" x2="230" y2="252" gradientUnits="userSpaceOnUse"><stop stop-color="#183F35"/><stop offset="1" stop-color="#09291F"/></linearGradient>
          <linearGradient id="fruit" x1="78" y1="77" x2="183" y2="211" gradientUnits="userSpaceOnUse"><stop stop-color="#C4F27B"/><stop offset="0.5" stop-color="#8EDC64"/><stop offset="1" stop-color="#46BB79"/></linearGradient>
        </defs>
        <rect x="4" y="4" width="248" height="248" rx="60" fill="url(#tile)"/>
        <rect x="5" y="5" width="246" height="246" rx="59" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
        <path d="M128 69C129 46 148 31 178 34C176 57 156 73 128 69Z" fill="#B5EA76"/>
        <path d="M123 77C121 64 115 55 107 51" stroke="#71C688" stroke-width="9" stroke-linecap="round"/>
        <path d="M128 83C111 72 86 75 69 90C51 106 48 129 54 152C62 184 89 211 113 214C120 215 125 212 128 212C131 212 136 215 143 214C167 211 194 184 202 152C208 129 205 106 187 90C170 75 145 72 128 83Z" fill="url(#fruit)"/>
        <path d="M111 116C111 111 115 109 119 112L158 136C162 138 162 143 158 146L119 170C115 172 111 170 111 166V116Z" fill="#103C2E"/>
      </svg>
      <div>
        <h1>青果短剧</h1>
        <p class="brand-caption">QINGGUO SHORTS</p>
      </div>
    </div>
    <p class="sub">让灵感生长，让故事成片。<br />从剧本到银幕，与团队一起创作。</p>

    <div id="inviteBanner" class="banner hidden"></div>

    <!-- 已登录用户打开邀请链接时的快捷加入面板 -->
    <div id="alreadyAuthedBox" class="hidden">
      <p id="authedDesc" style="margin: 0 0 14px; font-size: 13.5px; color: #e7dfd5;"></p>
      <button type="button" id="acceptInviteBtn" class="primary-btn">立即加入该团队</button>
      <button type="button" id="goWorkspaceBtn" class="ghost-btn">直接进入工作台</button>
      <div class="msg error" id="authedError"></div>
    </div>

    <!-- 未登录表单区 -->
    <div id="authFormsBox">
      <div class="tabs" id="tabsBar">
        <button type="button" class="tab active" data-tab="login">账号登录</button>
        <button type="button" class="tab" data-tab="register" id="registerTabBtn">注册新账号</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm">
        <div class="field">
          <label for="loginUsername">用户名 <span class="opt">管理员可直接留空</span></label>
          <input id="loginUsername" name="username" type="text" autocomplete="username" maxlength="32" placeholder="输入用户名（留空默认管理员）" />
        </div>
        <div class="field">
          <label for="loginPassword">登录密码</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="1024" required placeholder="请输入密码" />
        </div>
        <div class="field hidden" id="loginInviteField">
          <label for="loginInviteCode">同时接受团队邀请码 <span class="opt">选填</span></label>
          <input id="loginInviteCode" name="invite_code" type="text" maxlength="32" placeholder="例如 INV-XXXX" />
        </div>
        <button type="submit" class="primary-btn" id="loginSubmitBtn">进入工作台</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" class="hidden">
        <div id="bonusBanner" class="banner hidden"></div>
        <div class="field">
          <label for="regUsername">用户名 <span class="opt">3~32 位字母/数字/下划线</span></label>
          <input id="regUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.-]{3,32}" required placeholder="例如 studio_alice" />
        </div>
        <div class="field">
          <label for="regDisplayName">显示昵称 <span class="opt">团队内展示名称</span></label>
          <input id="regDisplayName" name="display_name" type="text" maxlength="50" placeholder="例如 导演小艾（选填）" />
        </div>
        <div class="field">
          <label for="regPassword">设置密码 <span class="opt">至少 6 位</span></label>
          <input id="regPassword" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required placeholder="至少 6 位字符" />
        </div>
        <div class="field">
          <label for="regPassword2">确认密码</label>
          <input id="regPassword2" type="password" autocomplete="new-password" minlength="6" maxlength="128" required placeholder="再次输入密码" />
        </div>
        <div class="field" id="regInviteField">
          <label for="regInviteCode">团队邀请码 <span class="opt" id="regInviteHint">选填，凭码直接加入对应团队</span></label>
          <input id="regInviteCode" name="invite_code" type="text" maxlength="32" placeholder="如有邀请码请填写，无则留空创建个人空间" />
        </div>
        <button type="submit" class="primary-btn" id="regSubmitBtn">注册并进入工作台</button>
      </form>

      <div class="msg error" id="formMsg"></div>
    </div>

    <div class="foot-note">青果短剧 · AI 短剧创作工作台</div>
  </div>

  <script>
    // 登录页的图标也内嵌，避免未登录请求受保护的前端资源。
    const favicon = document.createElement('link')
    favicon.rel = 'icon'
    favicon.type = 'image/svg+xml'
    favicon.href = 'data:image/svg+xml,' + encodeURIComponent(document.querySelector('.brand-logo').outerHTML)
    document.head.appendChild(favicon)

    const ROLE_LABELS = { owner: '所有者', admin: '管理员', member: '正式成员', viewer: '只读访客' }

    // 后端成功响应体为 { code: 200|201, message: 'success' }；只有非 2xx 才算失败
    function apiFailed(resp, json) {
      if (!resp.ok) return true
      const code = Number(json && json.code)
      return Number.isFinite(code) && code !== 0 && (code < 200 || code >= 300)
    }
    const params = new URLSearchParams(location.search)
    const urlInvite = (params.get('invite') || params.get('code') || '').trim()

    const inviteBanner = document.getElementById('inviteBanner')
    const alreadyAuthedBox = document.getElementById('alreadyAuthedBox')
    const authedDesc = document.getElementById('authedDesc')
    const acceptInviteBtn = document.getElementById('acceptInviteBtn')
    const goWorkspaceBtn = document.getElementById('goWorkspaceBtn')
    const authedError = document.getElementById('authedError')

    const authFormsBox = document.getElementById('authFormsBox')
    const tabsBar = document.getElementById('tabsBar')
    const registerTabBtn = document.getElementById('registerTabBtn')
    const loginForm = document.getElementById('loginForm')
    const registerForm = document.getElementById('registerForm')
    const loginInviteField = document.getElementById('loginInviteField')
    const loginInviteCode = document.getElementById('loginInviteCode')
    const regInviteField = document.getElementById('regInviteField')
    const regInviteCode = document.getElementById('regInviteCode')
    const regInviteHint = document.getElementById('regInviteHint')
    const bonusBanner = document.getElementById('bonusBanner')
    const formMsg = document.getElementById('formMsg')

    let policy = {
      allow_open_register: true,
      allow_invite_register: true,
      register_bonus_credits: 0,
      billing_enabled: true,
    }

    function setTab(tab) {
      formMsg.textContent = ''
      formMsg.className = 'msg error'
      document.querySelectorAll('.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab)
      })
      loginForm.classList.toggle('hidden', tab !== 'login')
      registerForm.classList.toggle('hidden', tab !== 'register')
      if (tab === 'login') {
        document.getElementById('loginPassword').focus()
      } else {
        document.getElementById('regUsername').focus()
      }
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.dataset.tab))
    })

    async function checkInviteCode(code) {
      if (!code) {
        inviteBanner.classList.add('hidden')
        return null
      }
      try {
        const resp = await fetch('/api/v1/auth/invite-info?code=' + encodeURIComponent(code))
        const json = await resp.json()
        const info = json.data || {}
        inviteBanner.classList.remove('hidden')
        if (info.valid) {
          inviteBanner.className = 'banner ok'
          inviteBanner.textContent = `✓ 有效邀请码：加入团队「${info.team_name}」（身份：${ROLE_LABELS[info.role] || info.role}）`
          return info
        } else {
          inviteBanner.className = 'banner warn'
          inviteBanner.textContent = `邀请码提示：${info.message || '无效或已过期'}`
          return null
        }
      } catch {
        return null
      }
    }

    let inviteTimer = null
    regInviteCode.addEventListener('input', () => {
      clearTimeout(inviteTimer)
      const val = regInviteCode.value.trim()
      inviteTimer = setTimeout(() => checkInviteCode(val), 350)
    })

    async function boot() {
      if (urlInvite) {
        loginInviteField.classList.remove('hidden')
        loginInviteCode.value = urlInvite
        regInviteCode.value = urlInvite
      }

      try {
        const [statusResp, invInfo] = await Promise.all([
          fetch('/api/v1/auth/status'),
          urlInvite ? checkInviteCode(urlInvite) : Promise.resolve(null),
        ])
        const statusJson = await statusResp.json()
        const st = statusJson.data || {}
        if (st.enabled === false) {
          location.replace('/')
          return
        }

        if (st.authenticated) {
          if (urlInvite && invInfo && invInfo.valid) {
            authFormsBox.classList.add('hidden')
            alreadyAuthedBox.classList.remove('hidden')
            authedDesc.textContent = `当前已登录账号「${st.user?.display_name || st.user?.username}」，是否立即接受邀请并切换到团队「${invInfo.team_name}」？`
            return
          }
          location.replace('/')
          return
        }

        policy = { ...policy, ...st }
        const canRegister = Boolean(policy.allow_open_register || policy.allow_invite_register)
        if (!canRegister) {
          tabsBar.classList.add('hidden')
        } else {
          if (!policy.allow_open_register && policy.allow_invite_register) {
            regInviteCode.required = true
            regInviteHint.textContent = '必填（当前仅开放邀请注册）'
            regInviteCode.placeholder = '请输入管理员发放的团队邀请码'
          } else if (policy.allow_open_register && !policy.allow_invite_register) {
            regInviteField.classList.add('hidden')
          }

          if (policy.billing_enabled && Number(policy.register_bonus_credits) > 0) {
            bonusBanner.textContent = `🎁 新用户注册自动开通个人创作空间，并赠送 ${policy.register_bonus_credits} 算力点`
            bonusBanner.classList.remove('hidden')
          }

          if (urlInvite && invInfo && invInfo.valid) {
            setTab('register')
          }
        }
      } catch {
        // 网络抖动时保留默认登录视图
      }
    }

    goWorkspaceBtn.addEventListener('click', () => location.replace('/'))

    acceptInviteBtn.addEventListener('click', async () => {
      authedError.textContent = ''
      acceptInviteBtn.disabled = true
      try {
        const resp = await fetch('/api/v1/teams/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: urlInvite }),
        })
        const json = await resp.json().catch(() => ({}))
        if (apiFailed(resp, json)) {
          throw new Error(json.message || '加入团队失败')
        }
        location.replace('/')
      } catch (err) {
        authedError.textContent = err.message || '加入团队失败'
        acceptInviteBtn.disabled = false
      }
    })

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault()
      formMsg.textContent = ''
      const btn = document.getElementById('loginSubmitBtn')
      btn.disabled = true
      try {
        const payload = {
          password: document.getElementById('loginPassword').value,
        }
        const username = document.getElementById('loginUsername').value.trim()
        const invite = loginInviteCode.value.trim()
        if (username) payload.username = username
        if (invite) payload.invite_code = invite

        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        const json = await resp.json().catch(() => ({}))
        if (apiFailed(resp, json)) {
          throw new Error(json.message || '登录失败')
        }
        location.replace('/')
      } catch (err) {
        formMsg.textContent = err.message || '登录失败'
        btn.disabled = false
      }
    })

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault()
      formMsg.textContent = ''
      const pwd1 = document.getElementById('regPassword').value
      const pwd2 = document.getElementById('regPassword2').value
      if (pwd1 !== pwd2) {
        formMsg.textContent = '两次输入的密码不一致'
        return
      }

      const btn = document.getElementById('regSubmitBtn')
      btn.disabled = true
      try {
        const payload = {
          username: document.getElementById('regUsername').value.trim(),
          display_name: document.getElementById('regDisplayName').value.trim() || undefined,
          password: pwd1,
          invite_code: regInviteCode.value.trim() || undefined,
        }
        const resp = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        const json = await resp.json().catch(() => ({}))
        if (apiFailed(resp, json)) {
          throw new Error(json.message || '注册失败')
        }
        location.replace('/')
      } catch (err) {
        formMsg.textContent = err.message || '注册失败'
        btn.disabled = false
      }
    })

    boot()
  </script>
</body>
</html>
