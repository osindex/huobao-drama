<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 火宝短剧</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #14120f; color: #f6f1ea;
      font: 15px/1.5 "Segoe UI", "PingFang SC", sans-serif;
    }
    form {
      width: min(360px, calc(100vw - 32px));
      padding: 28px; border-radius: 16px;
      background: #211e1a; border: 1px solid #3a342c;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 20px; color: #b7ab9d; font-size: 13px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #b7ab9d; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #4a433a; background: #14120f; color: inherit; font: inherit;
    }
    button {
      width: 100%; margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 999px;
      background: linear-gradient(135deg, #f97316, #fb923c); color: #1a1008;
      font: 600 14px/1 inherit; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error { min-height: 20px; margin-top: 10px; color: #ff8d8d; font-size: 13px; }
  </style>
</head>
<body>
  <form id="login">
    <h1>火宝短剧</h1>
    <p>这个站点已开启登录。图片和视频文件地址仍然可以直接访问。</p>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required autofocus />
    <button type="submit">登录</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const form = document.getElementById('login')
    const error = document.getElementById('error')
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      error.textContent = ''
      const button = form.querySelector('button')
      button.disabled = true
      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: form.password.value }),
        })
        const json = await resp.json().catch(() => ({}))
        if (!resp.ok) throw new Error(json.message || '登录失败')
        location.replace('/')
      } catch (err) {
        error.textContent = err.message || '登录失败'
        button.disabled = false
      }
    })
  </script>
</body>
</html>
